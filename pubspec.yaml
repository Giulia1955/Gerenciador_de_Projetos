name: apk_auth
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cupertino_icons: ^1.0.8
  lottie: ^3.8.2
  provider: ^6.1.5+1
  cloud_firestore: ^5.6.12
  table_calendar: ^3.3.0
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  http: ^1.6.0
  image: ^4.13.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^3.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon/icon.png"  

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/animation/